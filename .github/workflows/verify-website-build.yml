name: Verify website build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install root dependencies
        run: npm install --no-save --package-lock=false --legacy-peer-deps
      - name: Build client and server
        run: npm run build
      - name: Verify collector dispatch
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps @electric-sql/pglite@0.3.14
          node scripts/test-collector.cjs
          node scripts/test-collector-dispatch.cjs
