name: Verify ABLY memory-resume agent
on:
  pull_request:
    paths:
      - "tools/collector_web_agent.py"
      - "tools/test_ably_top10_cycle.py"
      - ".github/workflows/verify-ably-memory.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install agent import dependencies
        run: python -m pip install requests
      - name: Compile agent
        run: python -m py_compile tools/collector_web_agent.py
      - name: Test batch resume and memory guard
        run: python -m unittest discover -s tools -p test_ably_top10_cycle.py -v
