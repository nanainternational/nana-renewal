name: Build Happy Call APK
on:
  pull_request:
    paths:
      - 'android-sms-sender/**'
      - '.github/workflows/happy-call-release.yml'
  push:
    branches: [main]
    paths:
      - 'android-sms-sender/**'
      - '.github/workflows/happy-call-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: happy-call-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore signing key
        if: github.event_name != 'pull_request'
        env:
          KEY: ${{ secrets.NANA_SMS_SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/happy-call.jks"
          chmod 600 "$RUNNER_TEMP/happy-call.jks"
          echo "NANA_SMS_KEYSTORE_FILE=$RUNNER_TEMP/happy-call.jks" >> "$GITHUB_ENV"
      - name: Build dedicated app without internal device key
        if: github.event_name != 'pull_request'
        working-directory: android-sms-sender
        env:
          NANA_SMS_KEYSTORE_PASSWORD: ${{ secrets.NANA_SMS_KEYSTORE_PASSWORD }}
          NANA_SMS_KEY_ALIAS: ${{ secrets.NANA_SMS_KEY_ALIAS }}
          NANA_SMS_KEY_PASSWORD: ${{ secrets.NANA_SMS_KEY_PASSWORD }}
        run: gradle --no-daemon assembleHappycallRelease assembleInternalDebug
      - name: Compile both app variants on pull requests
        if: github.event_name == 'pull_request'
        working-directory: android-sms-sender
        run: gradle --no-daemon assembleHappycallDebug assembleInternalDebug
      - name: Verify permissions and publish beta
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK=android-sms-sender/app/build/outputs/apk/happycall/release/app-happycall-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.nanainter.smssender.happycall'"
          PERMISSIONS=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK")
          if printf '%s' "$PERMISSIONS" | grep -Eq 'READ_SMS|RECEIVE_SMS|READ_CALL_LOG'; then
            echo 'Unexpected sensitive permission in Happy Call APK' >&2
            exit 1
          fi
          test -f android-sms-sender/app/build/generated/source/buildConfig/happycall/release/com/nanainter/smssender/BuildConfig.java
          grep -q 'SMS_DEVICE_API_KEY = ""' android-sms-sender/app/build/generated/source/buildConfig/happycall/release/com/nanainter/smssender/BuildConfig.java
          cp "$APK" nana-happy-call.apk
          TAG="happy-call-v1.0.0-${GITHUB_SHA:0:8}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" nana-happy-call.apk --clobber
          else
            gh release create "$TAG" nana-happy-call.apk --target "$GITHUB_SHA" --title 'Nana 해피콜 웹 연동 베타' --notes '판매자별 연결 키를 사용하는 전용 앱입니다. 문자·통화 이력을 수집하지 않습니다.' --prerelease --latest=false
          fi
